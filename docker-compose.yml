name: labtrail

services:
  powercontext:
    image: labtrail-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - powercontext
      - server
      - run
      - --host
      - 0.0.0.0
      - --port
      - "8890"
      - --no-env-file
      - --role
      - all
    environment:
      POWERCONTEXT_HOME: /data/powercontext
      # Container port is not published to the host; only the Compose network can reach it.
      POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
    volumes:
      - powercontext-data:/data/powercontext
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8890/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  backend:
    image: labtrail-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      powercontext:
        condition: service_healthy
    environment:
      SEEKDB_MODE: embedded
      SEEKDB_PATH: /app/backend/data/seekdb
      POWERCONTEXT_URL: http://powercontext:8890
      HOST: 0.0.0.0
      PORT: "8000"
      FRONTEND_URL: http://localhost:5173
      AUTO_LOAD_DEMO: "true"
    volumes:
      - labtrail-data:/app/backend/data
    ports:
      - "8000:8000"
    command:
      - bash
      - -lc
      - |
        if [ "$$AUTO_LOAD_DEMO" = "true" ]; then
          python scripts/load_demo_data.py || echo "demo data load failed; starting API anyway"
        fi
        cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  labtrail-data:
  powercontext-data:
